name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8 (style + obvious errors only)
        run: |
          flake8 src tests app.py --max-line-length=100 --extend-ignore=E203,W503 --statistics

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Regenerate cleaned dataset (pipeline smoke test)
        run: |
          python src/data_cleaning.py

      - name: Import the Streamlit app to catch top-level errors
        run: |
          python -c "import ast; ast.parse(open('app.py').read())"
